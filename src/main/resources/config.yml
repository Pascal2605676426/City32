# ===== CityBuild Konfiguration =====
# Farbcodes mit & (z.B. &a = gruen, &c = rot)
# Nach Aenderungen: /citybuild reload  (Shop, Raenge und Preise werden sofort neu gelesen)

prefix: "&8[&bCityBuild&8] &7"

economy:
  start-balance: 1000.0
  currency-symbol: "$"
  max-pay: 1000000000.0

# ----- Grundstuecke (eigene Plot-Welt wie bei PlotSquared) -----
# WICHTIG: plot-size, road-width, plot-height und die Materialien gelten fuer die Welt,
# sobald sie erstellt ist. Aendere sie danach NICHT mehr (sonst passt die Welt nicht mehr zu den Plots).
plots:
  enabled: true
  # Name der Plot-Welt (wird beim ersten Start automatisch erstellt)
  world: "plotwelt"
  # Groesse eines Grundstuecks in Bloecken (8 bis 128)
  plot-size: 32
  # Breite der Strasse zwischen Grundstuecken (3 bis 16)
  road-width: 7
  # Hoehe der Oberflaeche
  plot-height: 64
  materials:
    floor: GRASS_BLOCK
    filler: DIRT
    stone: STONE
    road: QUARTZ_BLOCK
    wall-unclaimed: STONE_SLAB
    wall-claimed: SANDSTONE_SLAB
  # Preis pro Grundstueck
  price: 2500.0
  # Wie viel Prozent des Preises bei /plot delete zurueckerstattet werden
  refund-percent: 50
  # Maximale Anzahl Grundstuecke pro Spieler (Permission citybuild.plots.unlimited = unbegrenzt)
  max-per-player: 5
  # Kosten fuer /plot merge (0 = kostenlos)
  merge-price: 0.0
  # So weit sucht /plot auto nach einem freien Grundstueck (in Grundstuecken vom Mittelpunkt)
  auto-max-radius: 200
  # Standardwerte der Flags (jeder Besitzer kann sie pro Grundstueck mit /plot flag aendern)
  default-flags:
    pvp: false
    mob-spawning: true
    fire: false
    explosion: false
    visitor-use: false

homes:
  # Standard-Anzahl Homes. Mehr per Permission: citybuild.homes.<Zahl> (z.B. citybuild.homes.10)
  default-max: 3

teleport:
  # Wartezeit vor Teleport in Sekunden (0 = sofort)
  delay-seconds: 3

spawn:
  teleport-on-first-join: true
  respawn-at-spawn: true

# ----- Scoreboard (Anzeige am rechten Rand) und Tab-Liste -----
scoreboard:
  enabled: true
  title: "&b&lCityBuild"
  footer: "&bplay.tickline.de"

tablist:
  header: "&b&lCityBuild"
  footer: "&7play.tickline.de"

# ----- Raenge -----
# Vergeben mit /rang <Spieler> <Rang>. Die Reihenfolge ist egal.
rank-default: spieler
ranks:
  admin:
    name: "Admin"
    prefix: "&4Admin &8| "
    name-color: "&4"
  mod:
    name: "Mod"
    prefix: "&9Mod &8| "
    name-color: "&9"
  vip:
    name: "VIP"
    prefix: "&6VIP &8| "
    name-color: "&6"
  spieler:
    name: "Spieler"
    prefix: "&7Spieler &8| "
    name-color: "&7"

# ----- Taegliche Belohnung (/daily) -----
daily:
  cooldown-hours: 24
  base-reward: 500.0
  # Zusatz pro Tag in Folge (ab dem 2. Tag)
  streak-bonus: 100.0
  # Ab diesem Tag steigt die Belohnung nicht weiter
  max-streak: 7

# ----- Clans -----
clans:
  create-cost: 5000.0
  max-members: 10

# ----- Welten -----
worlds:
  farmworld:
    enabled: true
    name: "farmwelt"
    # Zufalls-Teleport im Umkreis von X Bloecken um die Mitte
    random-radius: 2500
    # Weltgrenze (Durchmesser in Bloecken)
    border-size: 6000
  nether-random-radius: 1500

# ----- Verkaufspreise fuer /sell (Preis pro Stueck) -----
